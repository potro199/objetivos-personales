name: Corte diario 17:30

on:
  schedule:
    # 17:30 hora de Buenos Aires (UTC-3, sin horario de verano), lunes a viernes
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install simple-salesforce

      - name: Consultar Salesforce y actualizar la página
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_TOKEN: ${{ secrets.SF_TOKEN }}
        run: python build.py

      - name: Publicar
        run: |
          git config user.name "corte-diario"
          git config user.email "corte-diario@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "Corte $(TZ=America/Argentina/Buenos_Aires date '+%d/%m/%Y %H:%M')"
          git push
